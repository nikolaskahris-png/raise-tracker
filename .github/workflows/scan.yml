name: scan-raises
on:
  workflow_dispatch:
  # GitHub starts scheduled runs late on this repo, by 6 to 9 hours (05:17 started 13:36 on 16 Nov, 14:20 on 17 Nov and
  # 13:55 on 18 Nov; 17:41 started 23:56 on 17 Nov) and drops some. Four independent times a day keep a scan within
  # about 15 hours even so. A scheduled run that finds the data already fresh (see the first step) stops at once.
  schedule:
    - cron: '17 5 * * *'    # 05:17 UTC
    - cron: '41 11 * * *'   # 11:41 UTC
    - cron: '41 17 * * *'   # 17:41 UTC
    - cron: '11 23 * * *'   # 23:11 UTC
permissions:
  contents: write
# One data writer at a time (shared with daily-snapshot), so two pushes never race.
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # A run waits in the queue for the data writer before it starts. Without `ref`, checkout uses the commit that was
      # current when the run was queued, so a run that waited behind another data commit would build on a stale base and
      # conflict at `git pull --rebase` (scan-raises #20, 17 Nov 2026). `ref` makes it start from the branch's tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 30
      # Four schedules a day would otherwise run four full scans when GitHub delivers several late at once. A scheduled run
      # stops here when the last data commit is under 5 hours old. A run started by hand always scans.
      - name: Skip a scheduled run when the data is fresh
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct -- data/scan-report.md)
          age=$(( $(date +%s) - ${last:-0} ))
          echo "last data commit $age s ago"
          if [ "$age" -lt 18000 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: '22'
      - name: Scan MetaDAO launchpad
        if: steps.fresh.outputs.skip != 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/scan.mjs
      - name: Classify treasury flows
        if: always() && steps.fresh.outputs.skip != 'true'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/treasury.mjs
      - name: Commit data
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "raise-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
