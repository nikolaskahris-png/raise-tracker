name: daily-snapshot

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC every day
  workflow_dispatch: {}

permissions:
  contents: write

# One data writer at a time (shared with scan-raises), so two pushes never race.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # A run waits in the queue for the data writer before it starts. Without `ref`, checkout uses the commit that was
      # current when the run was queued, so a run that waited behind another data commit would build on a stale base and
      # conflict at `git pull --rebase` (scan-raises #20, 17 Nov 2026). `ref` makes it start from the branch's tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RPC_URL: ${{ secrets.RPC_URL }}
          RUN_TRIGGER: ${{ github.event_name }}
        run: python collector/run.py
      - name: Public commits per month (the file is replaced only if every repository was read)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/commits.py
      - name: Shipped work as numbers: releases and contributors (the file is replaced only if every repository was read)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/shipped.py
      - name: Commit snapshot (even if some steps failed, so failures are on record)
        if: always()
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F) (${{ github.event_name }})"
          git pull --rebase
          git push
